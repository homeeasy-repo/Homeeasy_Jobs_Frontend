<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lake Hiring Captain</title>
    <style>
        :root {
            --ink: #111827;
            --muted: #6b7280;
            --deep: #08192c;
            --navy: #12355b;
            --blue: #1797ff;
            --teal: #0f766e;
            --cyan: #25b7c8;
            --gold: #c9a646;
            --red: #9f1d35;
            --green: #13795b;
            --paper: #edf2f6;
            --line: #d8e2eb;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, Helvetica, sans-serif;
            color: var(--ink);
            background: var(--paper);
            letter-spacing: 0;
        }

        a {
            color: inherit;
        }

        button {
            min-height: 42px;
            border: 0;
            border-radius: 22px;
            background: var(--deep);
            color: var(--white);
            padding: 10px 16px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 16px clamp(18px, 4vw, 56px);
            background: rgba(255,255,255,0.88);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            color: var(--deep);
        }

        .logo {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--white);
            background: #0d2742;
            border: 4px solid #14233b;
            box-shadow: inset 0 0 0 3px var(--cyan);
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .nav a {
            text-decoration: none;
        }

        .stage {
            width: min(1380px, calc(100% - 28px));
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(350px, 470px) minmax(0, 1fr);
            gap: clamp(24px, 5vw, 70px);
            align-items: center;
            padding: clamp(22px, 5vw, 54px) 0;
        }

        .phone {
            position: relative;
            width: min(100%, 430px);
            min-height: 790px;
            margin: 0 auto;
            border-radius: 46px;
            background: #fbfbfc;
            box-shadow: 0 34px 70px rgba(8,25,44,0.22), inset 0 0 0 10px #101827;
            overflow: hidden;
        }

        .phone::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 50%;
            width: 132px;
            height: 30px;
            transform: translateX(-50%);
            border-radius: 0 0 18px 18px;
            background: #101827;
            z-index: 3;
        }

        .phone-status {
            height: 58px;
            display: flex;
            align-items: end;
            justify-content: space-between;
            padding: 0 34px 8px;
            color: #111827;
            font-size: 13px;
            font-weight: 800;
        }

        .phone-header {
            display: grid;
            place-items: center;
            gap: 4px;
            padding: 4px 22px 12px;
            border-bottom: 1px solid #e8edf2;
        }

        .captain-avatar {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--white);
            font-size: 31px;
            font-weight: 900;
            background: #0e2238;
            border: 7px solid #18243c;
            box-shadow: inset 0 0 0 5px #2bd5d5, 0 14px 24px rgba(8,25,44,0.18);
        }

        .phone-header strong {
            font-size: 20px;
        }

        .phone-header span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .thread {
            height: 604px;
            overflow: hidden;
            padding: 18px 18px 92px;
            background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
        }

        .day-pill {
            width: fit-content;
            margin: 0 auto 14px;
            padding: 4px 10px;
            border-radius: 999px;
            color: var(--muted);
            background: #edf2f7;
            font-size: 12px;
            font-weight: 800;
        }

        .message {
            max-width: 83%;
            margin: 0 0 10px;
            padding: 13px 15px;
            border-radius: 22px;
            font-size: 17px;
            line-height: 1.25;
            box-shadow: 0 5px 12px rgba(8,25,44,0.06);
        }

        .message.left {
            color: #111827;
            background: #e9eaed;
            border-bottom-left-radius: 6px;
        }

        .message.right {
            margin-left: auto;
            color: #ffffff;
            background: #1d9bff;
            border-bottom-right-radius: 6px;
        }

        .message small {
            display: block;
            margin-top: 6px;
            color: rgba(255,255,255,0.78);
            font-size: 11px;
            font-weight: 700;
        }

        .composer {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 22px;
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            gap: 8px;
            align-items: center;
        }

        .circle-button,
        .voice-dot {
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #6b7280;
            background: #ffffff;
            border: 1px solid #e2e8ef;
            font-size: 26px;
        }

        .input-pill {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border: 1px solid #e2e8ef;
            border-radius: 24px;
            color: #9aa3af;
            background: #ffffff;
            font-size: 18px;
        }

        .control {
            display: grid;
            gap: 22px;
        }

        .headline {
            max-width: 720px;
        }

        h1 {
            margin: 0 0 14px;
            color: var(--deep);
            font-size: clamp(44px, 6vw, 86px);
            line-height: 0.94;
            letter-spacing: 0;
        }

        .headline p {
            max-width: 680px;
            margin: 0;
            color: #415466;
            font-size: clamp(18px, 2vw, 23px);
            line-height: 1.35;
        }

        .deck-wrap {
            position: relative;
            min-height: 360px;
        }

        .deck-card {
            position: absolute;
            width: min(720px, 100%);
            min-height: 214px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 28px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 24px 50px rgba(8,25,44,0.16);
        }

        .deck-card:nth-child(1) {
            top: 0;
            left: 0;
            z-index: 4;
        }

        .deck-card:nth-child(2) {
            top: 48px;
            left: 34px;
            z-index: 3;
            transform: scale(0.985);
        }

        .deck-card:nth-child(3) {
            top: 96px;
            left: 68px;
            z-index: 2;
            transform: scale(0.97);
        }

        .deck-card:nth-child(4) {
            top: 144px;
            left: 102px;
            z-index: 1;
            transform: scale(0.955);
        }

        .deck-card h2 {
            margin: 0 0 8px;
            color: var(--navy);
            font-size: 24px;
            letter-spacing: 0;
        }

        .deck-value {
            display: block;
            margin: 8px 0;
            color: var(--deep);
            font-size: clamp(42px, 5vw, 72px);
            font-weight: 900;
            line-height: 0.95;
        }

        .deck-card p {
            max-width: 560px;
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            border-radius: 999px;
            padding: 5px 11px;
            color: var(--navy);
            background: #e8f3f7;
            border: 1px solid #c7dce7;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .badge.good {
            color: var(--green);
            background: #edf8f3;
            border-color: #b8dcca;
        }

        .badge.warn {
            color: #775b09;
            background: #fff8df;
            border-color: #e7d48b;
        }

        .badge.bad {
            color: var(--red);
            background: #fff2f4;
            border-color: #e4a6b1;
        }

        .lower-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
        }

        .panel {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(255,255,255,0.88);
            box-shadow: 0 16px 32px rgba(8,25,44,0.08);
        }

        .panel h2 {
            margin: 0 0 14px;
            color: var(--navy);
            font-size: 21px;
            letter-spacing: 0;
        }

        .mini-stack {
            display: grid;
            gap: 10px;
        }

        .mini-card {
            display: grid;
            gap: 6px;
            padding: 14px;
            border: 1px solid #d8e3ec;
            border-radius: 17px;
            background: #ffffff;
        }

        .mini-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: start;
        }

        .mini-title {
            color: var(--deep);
            font-weight: 900;
        }

        .subtle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.35;
        }

        .error {
            color: var(--red);
            font-weight: 900;
        }

        @media (max-width: 1080px) {
            .stage,
            .lower-grid {
                grid-template-columns: 1fr;
            }

            .phone {
                min-height: 760px;
            }

            .deck-wrap {
                min-height: auto;
                display: grid;
                gap: 12px;
            }

            .deck-card,
            .deck-card:nth-child(n) {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                min-height: auto;
            }
        }

        @media (max-width: 560px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .stage {
                width: min(100% - 18px, 1380px);
            }

            .phone {
                border-radius: 34px;
                min-height: 720px;
                box-shadow: inset 0 0 0 7px #101827, 0 18px 44px rgba(8,25,44,0.2);
            }

            .thread {
                height: 542px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="brand"><span class="logo">BL</span> Hiring Captain</div>
            <nav class="nav" aria-label="Hiring links">
                <a href="blue-lake-revenue-operator.html">Candidate Funnel</a>
                <a href="blue-lake-data-room.html">Packet I</a>
            </nav>
        </header>

        <main class="stage">
            <section class="phone" aria-label="Hiring Captain live thread">
                <div class="phone-status"><span>9:41</span><span>5G 100</span></div>
                <div class="phone-header">
                    <div class="captain-avatar">BL</div>
                    <strong>Hiring Captain</strong>
                    <span id="phone-revision">Connecting...</span>
                </div>
                <div class="thread" id="thread"></div>
                <div class="composer">
                    <div class="circle-button">+</div>
                    <div class="input-pill">Ask Captain</div>
                    <div class="voice-dot">•</div>
                </div>
            </section>

            <section class="control">
                <div class="headline">
                    <h1>Every hire is a deal.</h1>
                    <p>The captain watches intake, school routes, bounces, queue pressure, and action gates in one live surface.</p>
                    <div class="badge-row">
                        <button type="button" id="refresh-button">Refresh captain</button>
                        <span class="subtle" id="last-refresh">Not loaded yet</span>
                    </div>
                </div>

                <div class="deck-wrap" id="deck"></div>

                <div class="lower-grid">
                    <div class="panel">
                        <h2>Applicant Stack</h2>
                        <div class="mini-stack" id="recent-applications"></div>
                    </div>
                    <div class="panel">
                        <h2>Outreach Stack</h2>
                        <div class="mini-stack" id="outreach-state"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const STATUS_ENDPOINT = "https://bluelake-hiring-intake-w74pxoam6q-uc.a.run.app/api/hiring/status";
        const REFRESH_MS = 30000;
        const state = { loading: false };

        function esc(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function badge(text, kind = "") {
            return `<span class="badge ${kind}">${esc(text)}</span>`;
        }

        function message(text, side = "left", meta = "") {
            return `<div class="message ${side}">${esc(text)}${meta ? `<small>${esc(meta)}</small>` : ""}</div>`;
        }

        function deckCard(title, value, detail, badges) {
            return `
                <article class="deck-card">
                    <h2>${esc(title)}</h2>
                    <span class="deck-value">${esc(value)}</span>
                    <p>${esc(detail)}</p>
                    <div class="badge-row">${badges.join("")}</div>
                </article>
            `;
        }

        function miniCard(item, fallbackTitle = "Record") {
            const status = item.status || "unknown";
            const kind = status === "awaiting_captain" || status === "sent" ? "good" : status.includes("bounce") || status === "retired" ? "warn" : "";
            return `
                <article class="mini-card">
                    <div class="mini-top">
                        <div>
                            <div class="mini-title">#${esc(item.row_id || "")} ${esc(item.school || item.job_title || fallbackTitle)}</div>
                            <div class="subtle">${esc(item.program || item.source || item.application_id || "")}</div>
                        </div>
                        ${badge(status, kind)}
                    </div>
                    <div class="subtle">${esc(item.submitted_at || item.location || item.detail || "")}</div>
                </article>
            `;
        }

        function renderMiniStack(targetId, items, emptyText, fallbackTitle) {
            const target = document.getElementById(targetId);
            if (!items || !items.length) {
                target.innerHTML = `<div class="subtle">${esc(emptyText)}</div>`;
                return;
            }
            target.innerHTML = items.map((item) => miniCard(item, fallbackTitle)).join("");
        }

        function renderOutreach(outreach) {
            const cards = [
                {
                    row_id: "HR",
                    school: outreach.latest_wave || "Career-office wave",
                    program: `${outreach.routes_sent || 0} sent / ${outreach.routes_targeted || 0} targeted`,
                    status: "sent",
                    submitted_at: outreach.last_sent_utc || ""
                },
                ...(outreach.immediate_bounces || []).map((item, index) => ({
                    row_id: `B${index + 1}`,
                    school: item.school,
                    program: item.detail,
                    status: item.type,
                    submitted_at: "delivery reconciliation"
                }))
            ];
            renderMiniStack("outreach-state", cards, "No outreach state loaded.", "Outreach");
        }

        function render(data) {
            const worker = data.worker || {};
            const outreach = data.outreach || {};
            const limits = data.limits || {};
            const active = data.intake.web_active || 0;
            const total = data.intake.web_total || 0;
            const retired = data.intake.web_retired || 0;
            const queue = data.captain_queue_preview || [];
            const bounces = outreach.immediate_bounces || [];

            document.getElementById("phone-revision").textContent = data.service.revision || "live";
            document.getElementById("thread").innerHTML = `
                <div class="day-pill">Today</div>
                ${message(`Intake confirmed. ${total} web records are visible, ${active} active, ${retired} retired verification rows.`)}
                ${message(`Queue read complete. I can see ${queue.length} candidate rows in the current captain preview.`)}
                ${message(`University wave: ${outreach.routes_sent || 0}/${outreach.routes_targeted || 0} routes sent from ${outreach.source || "HR"}. ${bounces.length} immediate bounce records.`)}
                ${message(`Keep it honest: Indeed actions are ${limits.indeed_ads_live ? "live" : "off"} and durable databoxes are ${limits.durable_databoxes_live ? "live" : "off"}.`, "right", "Captain status")}
                ${message(`Worker mode is ${worker.mode || "unknown"}. Candidate sends and career-office replies are ${worker.sends_candidate_email ? "on" : "off"} / ${worker.sends_career_office_email ? "on" : "off"}.`)}
            `;

            document.getElementById("deck").innerHTML = [
                deckCard("Live Intake", data.service.revision || "unknown", "Public application form is connected to the candidate table.", [badge("API live", "good"), badge(`${active} active`)]),
                deckCard("Captain Queue", `${queue.length} rows`, "Preview rows are available for screening composition and databox rendering.", [badge(worker.mode || "unknown", worker.mode === "SHADOW" ? "warn" : "good"), badge("polls every 30s")]),
                deckCard("School Outreach", `${outreach.routes_sent || 0} sent`, `${outreach.held_for_confirmation?.length || 0} routes held for confirmation; ${bounces.length} bounce records found.`, [badge("HR mailbox"), badge(bounces.length ? "bounces tracked" : "clean", bounces.length ? "warn" : "good")]),
                deckCard("Action Gates", limits.indeed_ads_live ? "ready" : "blocked", "Indeed posting, autonomous candidate sends, and durable databoxes are visible as gates until they are live.", [badge(limits.indeed_ads_live ? "Indeed on" : "Indeed off", limits.indeed_ads_live ? "good" : "bad"), badge(limits.durable_databoxes_live ? "databox durable" : "databox local", limits.durable_databoxes_live ? "good" : "warn")])
            ].join("");

            renderMiniStack("recent-applications", data.recent_web_applications || [], "No web applications yet.", "Candidate");
            renderOutreach(outreach);
            document.getElementById("last-refresh").textContent = `Updated ${new Date().toLocaleString()} from ${data.generated_at}`;
        }

        async function refresh() {
            if (state.loading) return;
            state.loading = true;
            try {
                const response = await fetch(`${STATUS_ENDPOINT}?t=${Date.now()}`, { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error(data.error || "status unavailable");
                render(data);
            } catch (error) {
                document.getElementById("last-refresh").innerHTML = `<span class="error">${esc(error.message)}</span>`;
                document.getElementById("thread").innerHTML = message(`Status unavailable: ${error.message}`);
            } finally {
                state.loading = false;
            }
        }

        document.getElementById("refresh-button").addEventListener("click", refresh);
        refresh();
        window.setInterval(refresh, REFRESH_MS);
    </script>
</body>
</html>
